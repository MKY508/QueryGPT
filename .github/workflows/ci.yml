name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.11'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv export --locked --package receiptbi-api --extra dev --no-dev --no-emit-workspace --no-hashes --output-file "$RUNNER_TEMP/api-requirements.txt"
          uv pip install --system -r "$RUNNER_TEMP/api-requirements.txt"
          uv pip install --system --no-deps -e .

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: mypy --config-file mypy.ini

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=60
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVz

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          INTERNAL_API_URL: http://localhost:8000

  desktop:
    name: Desktop release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check release metadata before installing dependencies
        run: |
          node ../../scripts/version.mjs --check
          node --test ../../scripts/tests/version.test.mjs
          node scripts/validate-release-version.mjs --self-test

      - name: Install dependencies
        run: npm ci

      - name: Run desktop unit tests
        run: npm test

      - name: Compile Electron
        run: npm run compile:electron

  ci-success:
    name: CI Success
    needs: [backend, frontend, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.desktop.result }}" != "success" ]; then
            echo "At least one CI job failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
